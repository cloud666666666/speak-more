[project]
name = "capswriter-offline"
version = "1.1.0"
description = "CapsWriter-Offline 离线语音输入工具"
requires-python = ">=3.14"

dependencies = [
    # ASR 核心
    "sherpa-onnx",
    "numpy",
    "gguf",
    "onnxruntime-directml",
    "sentencepiece",
    "soundfile",
    "numba",

    # 网络与 API
    "websockets",
    "openai",
    "ollama",
    "httpx",
    "requests",

    # CLI 与界面
    "rich",
    "typer",
    "colorama",
    "markdown",
    "markdown-it-py",
    "tkhtmlview",

    # 输入与硬件
    "keyboard",
    "pynput",
    "pyclip",
    "sounddevice",
    "watchdog",
    "pystray",
    "Pillow",

    # 数据处理
    "pypinyin",
    "srt",
    "rapidfuzz",
    "pydub",

    # 对齐器分词（日/韩）
    "nagisa",
    "soynlp",

    # Windows
    "pywin32",
    "psutil",
    "comtypes",     # UI Automation：从你的纠正里自动学词（core/tools/ui_reader.py）
]

[dependency-groups]
build = [
    "pyinstaller",
]
